name: Nightly Content Pipeline

# Generates daily content (news, astrology), synthesises any missing library
# audio (resumable — only new items are rendered), validates legality and
# catalog depth, then deploys to Cloudflare R2.
#
# Weekly (Sundays): scrapes public-domain English text matched to top user
# interests (tools/harvest_top_interests.py), fans it out to every language,
# and auto-promotes it straight into the catalog with no human review step —
# an explicit choice, not an oversight (see CHANGELOG). Story illustration
# strips (tools/build_story_images.py, free Pollinations.ai, rate-limited)
# are (re)generated daily for anything new, resumable so this is a no-op
# once everything already has an image.
#
# Every run (hourly): drains the user-requested scrapeQueue Firestore
# collection (tools/process_scrape_queue.py) — a user typing a custom
# interest with no matching content queues it there, and this now surfaces
# it within ~1h worst case instead of the 12h it'd take waiting for a
# twice-daily run, or a week for the popularity-based harvest. The heavier
# daily-content steps (news/astrology/weather, weekly harvest) still only
# run on the twice-daily schedule below — running those hourly would be
# wasteful, since they don't change that often.
#
# True real-time (seconds, not ~1h) would need either a Cloud Function
# reacting to the Firestore write directly (needs Blaze billing, not
# enabled on globalir — same recurring blocker as elsewhere in this
# project) or embedding a GitHub Actions trigger token in the app so it
# could call workflow_dispatch itself (a real security risk: a repo-scoped
# credential shipped inside the APK, extractable by anyone). Hourly
# polling was chosen as the safe middle ground.
#
# Required repo secrets for deploy:
#   R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY / R2_ACCOUNT_ID
# Deploy is skipped automatically when secrets are absent (e.g. on forks).
#
# harvest_top_interests.py reads real user interests from Firestore via
# `gcloud auth print-access-token` — no GCP service-account is configured
# for this runner, so that read currently fails and it falls back to a
# fixed default interest list. Set one up whenever interest-driven
# targeting (vs. the defaults) actually matters.

on:
  schedule:
    - cron: "0 * * * *"    # hourly — scrape-queue drain only (lightweight)
    - cron: "30 0 * * *"   # 06:00 IST daily — full pipeline
    - cron: "30 12 * * *"  # 18:00 IST daily (news refresh) — full pipeline
  workflow_dispatch:

concurrency:
  group: nightly-content
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: global_radio
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: global_radio/tools/requirements.txt

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install -r tools/requirements.txt

      # Reuse previously rendered MP3s so only new items are synthesised.
      - name: Restore cdn_dist cache
        uses: actions/cache@v4
        with:
          path: global_radio/cdn_dist
          key: cdn-dist-${{ hashFiles('global_radio/tools/content/**/*.json') }}
          restore-keys: cdn-dist-

      # These don't change hour to hour — only run on the twice-daily
      # schedule (or a manual dispatch), not the hourly scrape-queue tick.
      - name: Fetch daily news
        if: github.event_name != 'schedule' || github.event.schedule != '0 * * * *'
        run: python tools/fetch_news.py || echo "news fetch degraded — continuing"

      - name: Generate daily astrology
        if: github.event_name != 'schedule' || github.event.schedule != '0 * * * *'
        run: python tools/astrology_cron.py || echo "astrology degraded — continuing"

      - name: Generate daily Gita verse
        if: github.event_name != 'schedule' || github.event.schedule != '0 * * * *'
        run: python tools/gita_verse.py || echo "gita degraded — continuing"

      - name: Generate daily weather bulletins
        if: github.event_name != 'schedule' || github.event.schedule != '0 * * * *'
        run: python tools/weather_cron.py || echo "weather degraded — continuing"

      # Every run: drain any user-requested custom interests first — these
      # are explicit demand (someone is actually waiting on this), so they
      # go before the weekly popularity-based harvest below.
      - name: Process user-requested scrape queue (auto-promoted, no review)
        run: python tools/process_scrape_queue.py --limit 8 || echo "queue processing degraded"

      # Sundays: harvest public-domain English text matched to whatever
      # interests real users actually have (Firestore `users.interests`,
      # falls back to a fixed default list if that read fails/is empty —
      # no GCP service-account is configured for this runner yet, so today
      # this always uses the fallback; wire one up whenever that matters),
      # fan it out to every language, and auto-promote straight into the
      # catalog. No editorial review step — see CHANGELOG for that call.
      - name: Weekly interest-driven sourcing harvest (auto-promoted, no review)
        if: github.event.schedule == '30 0 * * *'
        run: |
          if [ "$(date -u +%u)" = "7" ]; then
            python tools/harvest_top_interests.py --top 3 --limit 8 || echo "harvest degraded"
          else
            echo "not Sunday — skipping harvest"
          fi

      - name: Build library catalog (resumable, all languages)
        run: python tools/build_catalog.py

      # Rate-limited to Pollinations.ai's 1 req/15s anonymous-tier limit
      # (enforced inside the script itself), so this is safe to run daily —
      # it skips any base story that already has an image and only spends
      # time on whatever the Sunday harvest added.
      - name: Generate story illustration strips (resumable, rate-limited)
        run: python tools/build_story_images.py --panels 4 || echo "image gen degraded"

      - name: Legal check
        run: python tools/check_legal.py --all

      - name: Depth guard (>=20 per core category x language)
        run: python tools/catalog_depth.py --min 20 --report

      # `secrets` can't be referenced directly in a step `if:` condition
      # ("Unrecognized named-value: 'secrets'") — same issue already fixed
      # once in ios-build.yml; route through a step output instead.
      - name: Check for R2 deploy secrets
        id: r2_check
        env:
          KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        run: echo "enabled=$([ -n "$KEY_ID" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Configure rclone for R2
        if: steps.r2_check.outputs.enabled == 'true'
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${R2_ACCESS_KEY_ID}
          secret_access_key = ${R2_SECRET_ACCESS_KEY}
          endpoint = https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com
          EOF

      - name: Deploy to R2
        if: steps.r2_check.outputs.enabled == 'true'
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        run: ./tools/deploy_r2.sh r2 globalradio-cdn cdn_dist

      - name: Upload catalog artifact
        uses: actions/upload-artifact@v4
        with:
          name: catalog
          path: global_radio/cdn_dist/catalog.json
          retention-days: 14

      # No review gate — auto_promote_drafts.py already merged everything
      # into scraped.json and moved originals to drafts/promoted/. This is
      # purely an audit trail of what got auto-published and when, not a
      # checkpoint anything waits on. Runs every invocation now (not just
      # Sundays) since the scrapeQueue can promote content on any run;
      # if-no-files-found: ignore makes an empty run a harmless no-op.
      - name: Upload auto-promoted content audit log
        uses: actions/upload-artifact@v4
        with:
          name: auto-promoted-content
          path: global_radio/tools/content/library/drafts/promoted/
          retention-days: 30
          if-no-files-found: ignore
