name: Nightly Content Pipeline

# Generates daily content (news, astrology), synthesises any missing library
# audio (resumable — only new items are rendered), validates legality and
# catalog depth, then deploys to Cloudflare R2.
#
# Weekly (Sundays): scrapes public-domain English text matched to top user
# interests (tools/harvest_top_interests.py), fans it out to every language,
# and auto-promotes it straight into the catalog with no human review step —
# an explicit choice, not an oversight (see CHANGELOG). Images for anything
# new are (re)generated daily, resumable so this is a no-op once everything
# already has one: non-fiction content (scraped.json, devotion.json,
# finance.json) tries a real licensed photo first (tools/fetch_commons_
# images.py, Wikipedia/Commons), falling back to an AI illustration strip
# (tools/build_story_images.py, free Pollinations.ai, rate-limited) only if
# no license-clear photo is found; fiction (kids/fairytales/bedtime/
# folklore — invented characters) always gets the AI strip.
#
# Every run (hourly): drains the user-requested scrapeQueue Firestore
# collection (tools/process_scrape_queue.py) — a user typing a custom
# interest with no matching content queues it there, and this now surfaces
# it within ~1h worst case instead of the 12h it'd take waiting for a
# twice-daily run, or a week for the popularity-based harvest. The heavier
# daily-content steps (news/astrology/weather, weekly harvest) still only
# run on the twice-daily schedule below — running those hourly would be
# wasteful, since they don't change that often.
#
# True real-time (seconds, not ~1h) would need either a Cloud Function
# reacting to the Firestore write directly (needs Blaze billing, not
# enabled on globalir — same recurring blocker as elsewhere in this
# project) or embedding a GitHub Actions trigger token in the app so it
# could call workflow_dispatch itself (a real security risk: a repo-scoped
# credential shipped inside the APK, extractable by anyone). Hourly
# polling was chosen as the safe middle ground.
#
# Required repo secrets for deploy:
#   CDN_DEPLOY_TOKEN — fine-grained PAT, scoped ONLY to
#     prince11jose/globalradio-cdn-content with Contents: Read+Write. This is
#     the interim CDN the app actually reads from (CDN_BASE in the release
#     workflows points at raw.githubusercontent.com/.../globalradio-cdn-content).
#   R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY / R2_ACCOUNT_ID — optional, for a
#     future move off the interim GitHub-raw CDN onto real Cloudflare R2
#     (see tools/PRODUCTION_INFRA.md). Currently unconfigured; that step
#     no-ops until secrets are added.
# Both deploys are skipped automatically when their secrets are absent
# (e.g. on forks).
#
# harvest_top_interests.py reads real user interests from Firestore via
# `gcloud auth print-access-token` — no GCP service-account is configured
# for this runner, so that read currently fails and it falls back to a
# fixed default interest list. Set one up whenever interest-driven
# targeting (vs. the defaults) actually matters.

on:
  schedule:
    - cron: "0 * * * *"    # hourly — scrape-queue drain only (lightweight)
    - cron: "30 0 * * *"   # 06:00 IST daily — full pipeline
    - cron: "30 12 * * *"  # 18:00 IST daily (news refresh) — full pipeline
  workflow_dispatch:

concurrency:
  # Separate groups for the hourly scrape-queue drain vs. the twice-daily
  # full pipeline: a stuck/slow full-pipeline run (e.g. image generation
  # hanging on a slow upstream) must not block the hourly drain from ever
  # getting a turn — that's the whole point of the hourly cadence (see
  # header comment). workflow_dispatch (no .schedule) falls into "full"
  # since a manual run is expected to do everything.
  group: nightly-content-${{ github.event.schedule == '0 * * * *' && 'hourly' || 'full' }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: global_radio
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: global_radio/tools/requirements.txt

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install -r tools/requirements.txt

      # Reuse previously rendered MP3s so only new items are synthesised.
      - name: Restore cdn_dist cache
        uses: actions/cache@v4
        with:
          path: global_radio/cdn_dist
          key: cdn-dist-${{ hashFiles('global_radio/tools/content/**/*.json') }}
          restore-keys: cdn-dist-

      # These don't change hour to hour — only run on the twice-daily
      # schedule (or a manual dispatch), not the hourly scrape-queue tick.
      - name: Fetch daily news
        if: github.event_name != 'schedule' || github.event.schedule != '0 * * * *'
        run: python tools/fetch_news.py || echo "news fetch degraded — continuing"

      - name: Generate daily astrology
        if: github.event_name != 'schedule' || github.event.schedule != '0 * * * *'
        run: python tools/astrology_cron.py || echo "astrology degraded — continuing"

      - name: Generate daily Gita verse
        if: github.event_name != 'schedule' || github.event.schedule != '0 * * * *'
        run: python tools/gita_verse.py || echo "gita degraded — continuing"

      - name: Generate daily weather bulletins
        if: github.event_name != 'schedule' || github.event.schedule != '0 * * * *'
        run: python tools/weather_cron.py || echo "weather degraded — continuing"

      # Every run: drain any user-requested custom interests first — these
      # are explicit demand (someone is actually waiting on this), so they
      # go before the weekly popularity-based harvest below.
      - name: Process user-requested scrape queue (auto-promoted, no review)
        run: python tools/process_scrape_queue.py --limit 8 || echo "queue processing degraded"

      # Sundays: harvest public-domain English text matched to whatever
      # interests real users actually have (Firestore `users.interests`,
      # falls back to a fixed default list if that read fails/is empty —
      # no GCP service-account is configured for this runner yet, so today
      # this always uses the fallback; wire one up whenever that matters),
      # fan it out to every language, and auto-promote straight into the
      # catalog. No editorial review step — see CHANGELOG for that call.
      - name: Weekly interest-driven sourcing harvest (auto-promoted, no review)
        if: github.event.schedule == '30 0 * * *'
        run: |
          if [ "$(date -u +%u)" = "7" ]; then
            python tools/harvest_top_interests.py --top 3 --limit 8 || echo "harvest degraded"
          else
            echo "not Sunday — skipping harvest"
          fi

      - name: Build library catalog (resumable, all languages)
        run: python tools/build_catalog.py

      # Non-fiction content (scraped.json biographies/history, plus
      # devotion/finance explainers) gets a real licensed photo instead of
      # an AI illustration where one can be found (Wikipedia pageimage ->
      # Commons license check). Must run BEFORE the AI step below — it
      # writes to the same images_manifest.json, and the AI step skips
      # anything already in that manifest. Anything this can't find a
      # license-clear match for (most devotion/finance items, or a scraped
      # biography Wikipedia has no image for) falls through to the AI step
      # as a fallback, same resumable pattern as that step.
      - name: Fetch real photos for non-fiction content (Wikipedia/Commons)
        timeout-minutes: 20
        continue-on-error: true
        run: python tools/fetch_commons_images.py || echo "commons fetch degraded"

      # Rate-limited to Pollinations.ai's 1 req/15s anonymous-tier limit
      # (enforced inside the script itself), so this is safe to run daily —
      # it skips any base story that already has an image (real photo from
      # the step above, or a prior AI run) and only spends time on whatever
      # still needs one — fiction always does, non-fiction only on a
      # Commons miss.
      #
      # timeout-minutes + continue-on-error: on 2026-07-09/10, Pollinations.ai
      # got slow/unresponsive and a single stuck image (retries + backoff,
      # per-request timeout but no overall budget) ran this step past
      # GitHub's 6h job cap, which then wedged the shared concurrency group
      # (see above) and cancelled every queued run behind it for ~11h with
      # nothing reaching deploy. This step is resumable and non-critical —
      # bail out well short of the job cap and let legal-check/depth-guard/
      # deploy run anyway; whatever didn't get an image this run picks up
      # next run.
      - name: Generate story illustration strips (resumable, rate-limited)
        timeout-minutes: 30
        continue-on-error: true
        run: python tools/build_story_images.py --panels 4 || echo "image gen degraded"

      - name: Legal check
        run: python tools/check_legal.py --all

      - name: Depth guard (>=20 per core category x language)
        run: python tools/catalog_depth.py --min 20 --report

      # `secrets` can't be referenced directly in a step `if:` condition
      # ("Unrecognized named-value: 'secrets'") — same issue already fixed
      # once in ios-build.yml; route through a step output instead.
      - name: Check for R2 deploy secrets
        id: r2_check
        env:
          KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        run: echo "enabled=$([ -n "$KEY_ID" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Configure rclone for R2
        if: steps.r2_check.outputs.enabled == 'true'
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${R2_ACCESS_KEY_ID}
          secret_access_key = ${R2_SECRET_ACCESS_KEY}
          endpoint = https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com
          EOF

      - name: Deploy to R2
        if: steps.r2_check.outputs.enabled == 'true'
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        run: ./tools/deploy_r2.sh r2 globalradio-cdn cdn_dist

      # This is the deploy that actually matters today — the app fetches
      # catalog.json and story images from this repo via raw.githubusercontent.com,
      # not from R2 above (which has no secrets configured and has likely never
      # actually run). CDN_DEPLOY_TOKEN is a fine-grained PAT scoped to ONLY
      # this one repo with Contents: Read+Write — see tools/PRODUCTION_INFRA.md
      # for the plan to retire this in favor of real CDN infrastructure.
      - name: Check for CDN deploy token
        id: cdn_check
        env:
          TOKEN: ${{ secrets.CDN_DEPLOY_TOKEN }}
        run: echo "enabled=$([ -n "$TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Deploy to interim GitHub-raw CDN
        if: steps.cdn_check.outputs.enabled == 'true'
        env:
          CDN_DEPLOY_TOKEN: ${{ secrets.CDN_DEPLOY_TOKEN }}
        run: |
          rm -rf /tmp/cdn-deploy
          git clone --depth 1 "https://x-access-token:${CDN_DEPLOY_TOKEN}@github.com/prince11jose/globalradio-cdn-content.git" /tmp/cdn-deploy
          # Deliberately NOT --delete: this only adds/updates files. If the
          # cdn_dist cache ever misses or only partially rebuilds, an
          # unattended --delete here would silently wipe the entire live CDN
          # (1300+ audio files) to match an incomplete local directory —
          # an unattended job should never be able to do that much damage
          # on a cache miss. Orphaned files (e.g. a renamed/removed story)
          # are left behind; clean those up manually if it ever matters.
          rsync -a cdn_dist/ /tmp/cdn-deploy/ --exclude .git
          cd /tmp/cdn-deploy
          git config user.name "Global Radio Content Bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing new to deploy"
          else
            git commit -m "Automated content update ($(date -u +%Y-%m-%d))"
            git push origin main
          fi

      - name: Upload catalog artifact
        uses: actions/upload-artifact@v4
        with:
          name: catalog
          path: global_radio/cdn_dist/catalog.json
          retention-days: 14

      # No review gate — auto_promote_drafts.py already merged everything
      # into scraped.json and moved originals to drafts/promoted/. This is
      # purely an audit trail of what got auto-published and when, not a
      # checkpoint anything waits on. Runs every invocation now (not just
      # Sundays) since the scrapeQueue can promote content on any run;
      # if-no-files-found: ignore makes an empty run a harmless no-op.
      - name: Upload auto-promoted content audit log
        uses: actions/upload-artifact@v4
        with:
          name: auto-promoted-content
          path: global_radio/tools/content/library/drafts/promoted/
          retention-days: 30
          if-no-files-found: ignore
