name: iOS Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      export_method:
        description: "Export method for the signed build (only used when signing secrets are configured)"
        required: false
        default: app-store
        type: choice
        options:
          - app-store
          - ad-hoc
          - development

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # required by softprops/action-gh-release to attach the unsigned IPA to a release

# Production build flags — keep in sync with the Android release workflow.
# CDN_BASE/CATALOG_URL point at a free interim GitHub CDN (real narrated
# audio, not demo clips) — see global_radio/tools/FUTURE_FIREBASE_SETUP.md
# for the plan to migrate to Firebase Storage once billing is enabled on the
# real project. Verified working via
# test/streaming/cdn_streaming_path_test.dart before enabling this — do not
# flip DEMO_AUDIO without re-running that test against whatever CDN_BASE is
# set to; the previous CDN_BASE (cdn.globalradio.app) didn't resolve at all
# and shipped two broken releases (v1.0.1, v1.0.2) before this was caught.
env:
  DART_DEFINES: >-
    --dart-define=USE_FIREBASE_AUTH=true
    --dart-define=USE_ANALYTICS=true
    --dart-define=USE_CRASHLYTICS=true
    --dart-define=USE_REMOTE_CONFIG=true
    --dart-define=USE_PUSH=true
    --dart-define=DEMO_AUDIO=false
    --dart-define=CDN_BASE=https://raw.githubusercontent.com/prince11jose/globalradio-cdn-content/main
    --dart-define=CATALOG_URL=https://raw.githubusercontent.com/prince11jose/globalradio-cdn-content/main/catalog.json

jobs:
  # Runs on every push/PR with no Apple credentials required — verifies the
  # iOS target still compiles. This is the fast feedback loop. It packages an
  # unsigned .ipa (not installable as-is — it has no code signature, just a
  # zipped Payload/Runner.app — useful for re-signing elsewhere or inspection)
  # and uploads it as a workflow artifact on every run; on a version tag it's
  # also attached to the GitHub Release alongside the signed Android APK.
  build-unsigned:
    name: Build (unsigned, no credentials required)
    runs-on: macos-15
    defaults:
      run:
        working-directory: global_radio
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.4
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign ${{ env.DART_DEFINES }}

      - name: Package unsigned IPA
        run: |
          mkdir -p build/ios/ipa_unsigned/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa_unsigned/Payload/
          cd build/ios/ipa_unsigned
          zip -qr ../../../GlobalRadio-unsigned.ipa Payload

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: GlobalRadio-ios-unsigned-${{ github.ref_name }}
          path: global_radio/GlobalRadio-unsigned.ipa
          if-no-files-found: error

      - name: Attach unsigned IPA to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: global_radio/GlobalRadio-unsigned.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Produces a real, signed .ipa. Only runs on a version tag or a manual
  # trigger, and only if the required secrets are present — see
  # ios/RELEASE_SETUP.md for how to obtain each one from the Apple Developer
  # portal, and add them under Settings -> Secrets and variables -> Actions:
  #
  #   IOS_DIST_CERTIFICATE_BASE64   base64 of the .p12 distribution certificate
  #                                 (base64 -i Certificates.p12 | pbcopy)
  #   IOS_DIST_CERTIFICATE_PASSWORD password the .p12 was exported with
  #   IOS_PROVISIONING_PROFILE_BASE64
  #                                 base64 of the .mobileprovision file
  #                                 matching ios/ExportOptions.plist's
  #                                 provisioning profile name and bundle id
  #                                 com.globalradio.globalRadio
  #   IOS_KEYCHAIN_PASSWORD         any password — used only for the
  #                                 short-lived CI keychain, not reused
  #
  # Optional, to also upload straight to TestFlight instead of just
  # attaching the .ipa as a workflow artifact:
  #   APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID,
  #   APP_STORE_CONNECT_KEY_BASE64 (base64 of the .p8 API key)
  build-signed:
    name: Build & sign IPA
    runs-on: macos-15
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    defaults:
      run:
        working-directory: global_radio
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.4
          cache: true

      - name: Verify signing secrets are configured
        env:
          IOS_DIST_CERTIFICATE_BASE64: ${{ secrets.IOS_DIST_CERTIFICATE_BASE64 }}
          IOS_DIST_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DIST_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          missing=()
          [ -z "$IOS_DIST_CERTIFICATE_BASE64" ] && missing+=(IOS_DIST_CERTIFICATE_BASE64)
          [ -z "$IOS_DIST_CERTIFICATE_PASSWORD" ] && missing+=(IOS_DIST_CERTIFICATE_PASSWORD)
          [ -z "$IOS_PROVISIONING_PROFILE_BASE64" ] && missing+=(IOS_PROVISIONING_PROFILE_BASE64)
          [ -z "$IOS_KEYCHAIN_PASSWORD" ] && missing+=(IOS_KEYCHAIN_PASSWORD)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repo secrets for a signed iOS build: ${missing[*]}"
            echo "See the comment block above 'build-signed' in .github/workflows/ios-build.yml"
            echo "and global_radio/ios/RELEASE_SETUP.md for how to generate and add them."
            exit 1
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Install signing certificate and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_DIST_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERTIFICATE_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/dist_certificate.p12"
          PROFILE_PATH="$RUNNER_TEMP/build_profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/ios-signing.keychain-db"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          mkdir -p ~/Library/MobileDevice/"Provisioning Profiles"
          cp "$PROFILE_PATH" ~/Library/MobileDevice/"Provisioning Profiles"/

      - name: Select export options
        id: export_options
        run: |
          method="${{ inputs.export_method || 'app-store' }}"
          if [ "$method" = "app-store" ]; then
            echo "path=ios/ExportOptions.plist" >> "$GITHUB_OUTPUT"
          else
            echo "path=ios/ExportOptionsDev.plist" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed IPA
        run: |
          flutter build ipa --release \
            --export-options-plist=${{ steps.export_options.outputs.path }} \
            ${{ env.DART_DEFINES }}

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: GlobalRadio-ios-${{ github.ref_name }}
          path: global_radio/build/ios/ipa/*.ipa
          if-no-files-found: error

      - name: Check for TestFlight upload secrets
        id: testflight_check
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        # `secrets` can't be referenced directly in a step `if:` — route the
        # check through an output instead.
        run: echo "enabled=$([ -n "$KEY_ID" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Upload to TestFlight
        if: steps.testflight_check.outputs.enabled == 'true'
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
        run: |
          # altool finds API keys by naming convention in this search path —
          # it does not take a key file path argument directly.
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          echo -n "$APP_STORE_CONNECT_KEY_BASE64" | base64 --decode -o "$KEY_DIR/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          IPA_PATH=$(find global_radio/build/ios/ipa -name '*.ipa' -print -quit)
          xcrun altool --upload-app -f "$IPA_PATH" -t ios \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/ios-signing.keychain-db" || true
